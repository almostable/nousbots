services:
  db:
    image: postgres:alpine
    container_name: nousbots_db
    restart: always
    environment:
      POSTGRES_USER: noususer
      POSTGRES_PASSWORD: nouspass
      POSTGRES_DB: nous_db
    ports:
      - '5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: nousbots_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
